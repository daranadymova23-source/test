<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>БУХ.Контроль — изменения для бухгалтера</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#17212b;font:14px Arial,sans-serif}.app{display:flex;min-height:100vh}.side{width:250px;background:#17212b;color:#fff;padding:22px 16px;position:fixed;inset:0 auto 0 0}.logo{font-size:23px;font-weight:800;margin:6px 12px 28px}.logo b{color:#55c59a}.nav button{display:block;width:100%;border:0;background:none;color:#b8c4ce;text-align:left;padding:12px 14px;border-radius:9px;margin:3px 0;cursor:pointer}.nav button.active,.nav button:hover{background:#263641;color:#fff}.main{margin-left:250px;width:calc(100% - 250px);padding:28px 38px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.top h1{margin:0;font-size:27px}.org{background:#fff;border:1px solid #e0e5e9;padding:10px 14px;border-radius:10px}.search{display:flex;gap:10px;margin-bottom:20px}.search input{flex:1;padding:14px;border:1px solid #dce2e7;border-radius:10px;background:#fff}.btn{background:#247a5a;color:#fff;border:0;border-radius:9px;padding:11px 16px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#fff;border:1px solid #e2e7eb;border-radius:14px;padding:19px}.card h3{margin:9px 0}.muted{color:#71808d}.tag{display:inline-block;padding:5px 8px;border-radius:20px;background:#e8f7f0;color:#247a5a;font-size:11px}.tag.tax{background:#fff2dc;color:#9a6700}.tag.work{background:#e9f0ff;color:#315e9b}.date{color:#89949d;font-size:12px}.card a{color:#247a5a;text-decoration:none;font-weight:600}.section{background:#fff;border:1px solid #e2e7eb;border-radius:14px;padding:20px;margin-top:18px}.section h2{margin-top:0}.list{display:grid;gap:10px}.row{display:flex;justify-content:space-between;gap:20px;padding:14px 0;border-bottom:1px solid #edf0f2}.calendar{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.cal{background:#fff;border:1px solid #e2e7eb;border-radius:12px;padding:15px}.cal strong{display:block;font-size:18px}.modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.box{background:#fff;border-radius:15px;padding:25px;width:min(720px,100%);max-height:90vh;overflow:auto}.close{float:right;border:0;background:#eee;border-radius:50%;width:32px;height:32px}.box input,.box select{width:100%;padding:12px;margin:7px 0 13px;border:1px solid #dce2e7;border-radius:8px}@media(max-width:850px){.side{width:70px}.logo{font-size:0}.logo b{font-size:20px}.nav button{font-size:0;text-align:center}.main{margin-left:70px;width:calc(100% - 70px);padding:20px}.grid{grid-template-columns:1fr 1fr}.calendar{grid-template-columns:1fr 1fr}}@media(max-width:560px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;gap:10px;flex-direction:column}}
</style></head><body><div class="app"><aside class="side"><div class="logo">БУХ.<b>Контроль</b></div><nav class="nav"><button class="active" onclick="show('home',this)">🏠 Главная</button><button onclick="show('news',this)">📰 Изменения</button><button onclick="show('tax',this)">₽ Налоги</button><button onclick="show('accounting',this)">📚 Бухучет</button><button onclick="show('labor',this)">👥 Зарплата и кадры</button><button onclick="show('calendar',this)">📅 Календарь</button><button onclick="show('guides',this)">📖 Справочники</button></nav></aside><main class="main"><div class="top"><h1 id="title">Главная</h1><div class="org">ООО «Вектор» · 25.08.2026</div></div><div id="content"></div></main></div><div class="modal" id="modal"><div class="box"><button class="close" onclick="modal.classList.remove('show')">×</button><div id="modalText"></div></div></div><script>
const data=[
['Повышение НДС: что проверить бухгалтеру','Налоги','Сегодня','С 2026 года изменились отдельные правила налогового учета. Проверьте ставки, первичные документы и учетные настройки.'],
['Изменения в бухгалтерском учете','Бухучет','22.08.2026','Разъяснения Минфина по применению федеральных стандартов бухгалтерского учета и раскрытию информации.'],
['Новые правила по страховым взносам','Налоги','20.08.2026','ФНС обновила контрольные соотношения и порядок проверки расчета по страховым взносам.'],
['Что изменилось для работодателей','Зарплата и кадры','18.08.2026','Актуальные требования к расчету выплат, кадровым документам и срокам отчетности.'],
['Отчетность за 3 квартал','Отчетность','15.08.2026','Соберите первичные документы и проверьте налоговые регистры до наступления сроков сдачи.'],
['МСФО и российский учет','Бухучет','29.06.2026','Минфин сообщил об изменениях терминологии и документов по международным стандартам.']
];
function card(x){let cls=x[1]=='Налоги'?'tax':x[1].includes('Зарп')?'work':'';return `<article class="card"><span class="tag ${cls}">${x[1]}</span><div class="date">${x[2]}</div><h3>${x[0]}</h3><p class="muted">${x[3]}</p><a href="#" onclick="read('${x[0]}');return false">Читать разъяснение →</a></article>`}
function home(){return `<div class="search"><input id="q" placeholder="Поиск: НДС, ФСБУ, зарплата, отчетность..."><button class="btn" onclick="search()">Найти</button></div><div class="section"><h2>🔥 Главное для бухгалтера сегодня</h2><div class="grid">${data.slice(0,3).map(card).join('')}</div></div><div class="section"><h2>Ближайшие изменения</h2><div class="list"><div class="row"><span><b>Налоговая отчетность</b><br><span class="muted">Подготовка к 3 кварталу</span></span><b>30 сентября</b></div><div class="row"><span><b>Страховые взносы</b><br><span class="muted">Уплата за август</span></span><b>28 сентября</b></div><div class="row"><span><b>НДФЛ</b><br><span class="muted">Контроль сроков перечисления</span></span><b>28 августа</b></div></div></div><div class="section"><h2>Официальные источники</h2><p class="muted">Для проверки первоисточника используйте официальные публикации и нормативные базы.</p><p><a href="https://www.consultant.ru/" target="_blank">КонсультантПлюс →</a> &nbsp; <a href="https://www.nalog.gov.ru/" target="_blank">ФНС России →</a> &nbsp; <a href="https://minfin.gov.ru/" target="_blank">Минфин России →</a></p></div>`}
function show(name,btn){document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');let titles={home:'Главная',news:'Изменения законодательства',tax:'Налоги и взносы',accounting:'Бухгалтерский учет',labor:'Зарплата и кадры',calendar:'Календарь бухгалтера',guides:'Справочники'};title.textContent=titles[name];if(name==='home')content.innerHTML=home();else if(name==='news')content.innerHTML=`<div class="search"><input id="q" placeholder="Поиск по изменениям..."><button class="btn" onclick="search()">Найти</button></div><div class="grid">${data.map(card).join('')}</div>`;else if(name==='tax')content.innerHTML=`<div class="section"><h2>Налоговый блок</h2><div class="grid"><div class="card"><span class="tag tax">НДС</span><h3>Ставки и вычеты</h3><p class="muted">Изменения ставок, декларации, счета-фактуры, контрольные соотношения.</p></div><div class="card"><span class="tag tax">Налог на прибыль</span><h3>Расходы и доходы</h3><p class="muted">Актуальные правила признания доходов и расходов.</p></div><div class="card"><span class="tag tax">УСН</span><h3>Доходы и лимиты</h3><p class="muted">Лимиты, ставки, авансы и отчетность.</p></div></div></div>`;else if(name==='accounting')content.innerHTML=`<div class="section"><h2>Бухгалтерский учет</h2><div class="grid"><div class="card"><h3>ФСБУ</h3><p class="muted">Учет основных средств, аренды, запасов, капитальных вложений и доходов.</p></div><div class="card"><h3>Проводки и операции</h3><p class="muted">Справочник типовых хозяйственных операций и логика отражения в учете.</p></div><div class="card"><h3>Отчетность</h3><p class="muted">Баланс, ОФР, пояснения и контрольные процедуры.</p></div></div></div>`;else if(name==='labor')content.innerHTML=`<div class="section"><h2>Зарплата и кадры</h2><div class="grid"><div class="card"><h3>НДФЛ</h3><p class="muted">Ставки, вычеты, сроки перечисления и отчетность.</p></div><div class="card"><h3>Страховые взносы</h3><p class="muted">Тарифы, база, льготы и РСВ.</p></div><div class="card"><h3>Кадровые документы</h3><p class="muted">Прием, увольнение, отпуска, больничные и электронные документы.</p></div></div></div>`;else if(name==='calendar')content.innerHTML=`<div class="calendar"><div class="cal"><strong>28.08</strong>НДФЛ и страховые платежи</div><div class="cal"><strong>31.08</strong>Контроль кадровых документов</div><div class="cal"><strong>28.09</strong>Налоги и страховые взносы</div><div class="cal"><strong>30.09</strong>Квартальная отчетность</div></div>`;else content.innerHTML=`<div class="section"><h2>${titles[name]}</h2><p class="muted">Раздел справочной системы: нормативные документы, письма ведомств, формы, разъяснения и практические материалы.</p></div>`}
function read(t){modalText.innerHTML=`<h2>${t}</h2><p>Это демонстрационная карточка. В рабочей версии здесь можно показывать полный текст изменения, дату вступления в силу, затронутые статьи НК РФ/законы, кого касается изменение и что бухгалтеру нужно сделать.</p><button class="btn" onclick="modal.classList.remove('show')">Понятно</button>`;modal.classList.add('show')}
function search(){let q=(document.getElementById('q')?.value||'').toLowerCase();let found=data.filter(x=>x.join(' ').toLowerCase().includes(q));content.innerHTML=`<div class="search"><input id="q" value="${q}" placeholder="Поиск..."><button class="btn" onclick="search()">Найти</button></div><div class="grid">${found.length?found.map(card).join(''):'<div class="section">Ничего не найдено. Попробуйте «НДС», «ФСБУ» или «зарплата».</div>'}</div>`}
content.innerHTML=home();
</script></body></html>
