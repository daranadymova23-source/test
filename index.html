<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>БУХ.Контроль — личный справочник бухгалтера</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f5f7f9;color:#17212b}.app{display:flex;min-height:100vh}.side{width:245px;background:#17212b;color:#fff;position:fixed;inset:0 auto 0 0;padding:22px 16px}.logo{font-size:23px;font-weight:800;margin:6px 12px 30px}.logo b{color:#55c59a}.nav button{display:block;width:100%;border:0;background:none;color:#b9c4ce;text-align:left;padding:12px 14px;border-radius:9px;margin:3px 0;cursor:pointer}.nav button.active,.nav button:hover{background:#263641;color:#fff}.main{margin-left:245px;width:calc(100% - 245px);padding:28px 38px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.top h1{margin:0;font-size:27px}.org{background:#fff;border:1px solid #e0e5e9;padding:10px 14px;border-radius:10px}.search{display:flex;gap:10px;margin-bottom:18px}.search input{flex:1;padding:14px;border:1px solid #dce2e7;border-radius:10px;font-size:15px}.btn{background:#247a5a;color:#fff;border:0;border-radius:9px;padding:11px 16px;cursor:pointer}.hero{background:#fff;border:1px solid #e2e7eb;border-radius:14px;padding:22px;margin-bottom:18px}.hero h2{margin:0 0 8px}.muted{color:#71808d}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:18px 0}.stat,.card,.section{background:#fff;border:1px solid #e2e7eb;border-radius:14px;padding:18px}.stat strong{display:block;font-size:25px;margin-top:7px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card{cursor:pointer}.card:hover{border-color:#9bcdb9}.card h3{margin:8px 0}.tag{display:inline-block;padding:5px 8px;border-radius:20px;background:#e8f7f0;color:#247a5a;font-size:11px}.tag.tax{background:#fff2dc;color:#996500}.tag.work{background:#e9f0ff;color:#315e9b}.date{font-size:12px;color:#89949d}.card p{line-height:1.5;color:#52606b}.row{display:flex;justify-content:space-between;gap:20px;padding:14px 0;border-bottom:1px solid #edf0f2}.calendar{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.cal{background:#fff;border:1px solid #e2e7eb;border-radius:12px;padding:15px}.cal strong{display:block;font-size:18px;margin-bottom:6px}.modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;padding:20px;z-index:20}.modal.show{display:flex}.box{background:#fff;border-radius:15px;padding:25px;width:min(760px,100%);max-height:90vh;overflow:auto}.close{float:right;border:0;background:#eee;border-radius:50%;width:32px;height:32px;cursor:pointer}.box h2{margin-top:0}.source{display:inline-block;margin-top:14px;color:#247a5a;text-decoration:none;font-weight:600}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.filters button{background:#fff;border:1px solid #dce2e7;border-radius:20px;padding:8px 13px;cursor:pointer}.filters button.active{background:#17212b;color:#fff}.warn{background:#fff8e8;border-left:4px solid #e0a22b;padding:12px 14px;border-radius:8px;margin:14px 0}@media(max-width:900px){.side{width:70px}.logo{font-size:0}.logo b{font-size:20px}.nav button{font-size:0;text-align:center}.main{margin-left:70px;width:calc(100% - 70px);padding:20px}.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr 1fr}.calendar{grid-template-columns:1fr 1fr}}@media(max-width:560px){.stats,.grid,.calendar{grid-template-columns:1fr}.main{padding:14px}.top{flex-direction:column;align-items:flex-start;gap:10px}}</style></head><body><div class="app"><aside class="side"><div class="logo">БУХ.<b>Контроль</b></div><nav class="nav"><button class="active" onclick="show('home',this)">🏠 Главная</button><button onclick="show('changes',this)">📰 Изменения</button><button onclick="show('tax',this)">₽ Налоги</button><button onclick="show('accounting',this)">📚 Бухучет</button><button onclick="show('labor',this)">👥 Зарплата и кадры</button><button onclick="show('calendar',this)">📅 Календарь</button><button onclick="show('guides',this)">📖 Справочники</button></nav></aside><main class="main"><div class="top"><h1 id="title">Главная</h1><div class="org">Мой справочник · 25.08.2026</div></div><div class="search"><input id="search" placeholder="Поиск: НДС, НДФЛ, ФСБУ 26, УСН, взносы..." onkeydown="if(event.key==='Enter')doSearch()"><button class="btn" onclick="doSearch()">Найти</button></div><div id="content"></div></main></div><div class="modal" id="modal"><div class="box"><button class="close" onclick="closeModal()">×</button><div id="modalText"></div></div></div><script>
const changes=[
{cat:'НДС',tag:'tax',date:'01.01.2026',title:'Основная ставка НДС — 22%',text:'С 1 января 2026 года основная ставка НДС увеличена с 20% до 22%. Расчетные ставки также изменены: 22/122%.',action:'Проверить учетные системы, прайсы, договоры, счета-фактуры и переходные операции.',source:'ФНС — Налоги 2026',url:'https://www.nalog.gov.ru/new2026/'},
{cat:'УСН / НДС',tag:'tax',date:'01.01.2026',title:'Порог освобождения от НДС для УСН — 20 млн ₽',text:'Для УСН с 2026 года автоматическое освобождение от НДС действует при доходах за 2025 год до 20 млн рублей включительно. Далее порог снижается до 15 млн в 2027 году и 10 млн с 2028 года.',action:'Проверить доходы за 2025 год и определить порядок работы с НДС в 2026 году.',source:'ФНС — НДС',url:'https://www.nalog.gov.ru/rn77/TAXATION/TAXES/NDS/'},
{cat:'Страховые взносы',tag:'tax',date:'2026',title:'Предельная база взносов — 2 979 000 ₽',text:'На 2026 год предельная база для исчисления страховых взносов на каждого работника установлена в размере 2 979 000 рублей.',action:'Проверить настройки расчета взносов и контроль превышения базы.',source:'ФНС',url:'https://www.nalog.gov.ru/rn50/news/activities_fts/16626179/'},
{cat:'Страховые взносы',tag:'tax',date:'06.05.2026',title:'Изменена форма РСВ',text:'С 6 мая 2026 года расчеты по страховым взносам представляются с учетом изменений, внесенных приказом ФНС от 04.02.2026 № ЕД-1-11/67@.',action:'Убедиться, что используется актуальная форма РСВ.',source:'ФНС, письмо БС-36-11/1984@',url:'https://www.nalog.gov.ru/rn77/taxation/insprem/16610780/'},
{cat:'НДФЛ',tag:'work',date:'01.09.2026',title:'Новые правила уведомлений по НДФЛ и взносам',text:'С 1 сентября 2026 года меняются правила представления уведомлений и рассчитанных сумм НДФЛ и страховых взносов.',action:'Проверить регламент подготовки уведомлений перед сентябрьскими сроками.',source:'ФНС',url:'https://www.nalog.gov.ru/rn38/news/seminar/16616087/'},
{cat:'Налог на прибыль',tag:'tax',date:'2026',title:'Ограничение учета убытков прошлых лет продлено',text:'Ограничение по учету убытков прошлых лет в размере 50% продлено до 2030 года включительно.',action:'Учесть ограничение при расчете налоговой базы.',source:'ФНС — Налоги 2026',url:'https://www.nalog.gov.ru/new2026/'}];
function card(c){return `<div class="card" onclick='openChange(${JSON.stringify(c).replace(/'/g,"&#39;")})'><span class="tag ${c.tag}">${c.cat}</span><div class="date">${c.date}</div><h3>${c.title}</h3><p>${c.text}</p><b>Что сделать бухгалтеру →</b></div>`}
function home(){return `<div class="hero"><h2>Ваш личный помощник бухгалтера</h2><div class="muted">Изменения законодательства, сроки и практические действия — в одном месте.</div></div><div class="stats"><div class="stat">Изменений в базе<strong>${changes.length}</strong></div><div class="stat">Налоговые<strong>4</strong></div><div class="stat">Важные сроки<strong>3</strong></div><div class="stat">Проверить<strong>5</strong></div></div><div class="section"><h2>🔥 Главное для бухгалтера</h2><div class="grid">${changes.slice(0,3).map(card).join('')}</div></div><div class="section"><h2>⚠️ Что проверить сейчас</h2><div class="row"><span>НДС 22% и переходные документы</span><b>Важно</b></div><div class="row"><span>Актуальная форма РСВ</span><b>Проверить</b></div><div class="row"><span>НДФЛ и уведомления с 1 сентября</span><b>Подготовиться</b></div></div>`}
function list(title,items){return `<div class="filters"><button class="active" onclick="renderFiltered(this,'all')">Все</button>${[...new Set(items.map(x=>x.cat))].map(x=>`<button onclick="renderFiltered(this,'${x}')">${x}</button>`).join('')}</div><div class="grid" id="list">${items.map(card).join('')}</div>`}
function show(name,btn){document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');let title=name==='home'?'Главная':name==='changes'?'Изменения законодательства':name==='tax'?'Налоги':name==='accounting'?'Бухгалтерский учет':name==='labor'?'Зарплата и кадры':name==='calendar'?'Календарь бухгалтера':'Справочники';document.getElementById('title').textContent=title;if(name==='home')content.innerHTML=home();else if(name==='changes')content.innerHTML=list(title,changes);else if(name==='tax')content.innerHTML=list(title,changes.filter(x=>x.tag==='tax'));else if(name==='accounting')content.innerHTML=`<div class="section"><h2>Бухгалтерский учет</h2><div class="grid"><div class="card"><h3>ФСБУ</h3><p>Основные федеральные стандарты бухгалтерского учета и практические вопросы применения.</p></div><div class="card"><h3>Первичные документы</h3><p>Реквизиты, электронный документооборот, исправление ошибок.</p></div><div class="card"><h3>Отчетность</h3><p>Бухгалтерская отчетность, сроки и контрольные процедуры.</p></div></div></div>`;else if(name==='labor')content.innerHTML=list(title,changes.filter(x=>x.tag==='work'));else if(name==='calendar')content.innerHTML=`<div class="calendar"><div class="cal"><strong>28 августа</strong><span>Налоговые платежи и обязательные сроки</span></div><div class="cal"><strong>1 сентября</strong><span>Начало действия новых правил</span></div><div class="cal"><strong>25 сентября</strong><span>Отчетные обязанности</span></div><div class="cal"><strong>28 сентября</strong><span>Налоги и взносы</span></div></div><div class="section"><h2>Мой календарь</h2><p class="muted">Даты здесь являются тестовыми — их можно расширить под ваши реальные обязанности.</p></div>`;else content.innerHTML=`<div class="section"><h2>Справочники</h2><div class="grid"><div class="card"><h3>НК РФ</h3><p>Налоговый кодекс и тематические разделы.</p></div><div class="card"><h3>ФСБУ / ПБУ</h3><p>Бухгалтерские стандарты.</p></div><div class="card"><h3>ФНС</h3><p>Письма, приказы и разъяснения.</p></div></div></div>`}
function renderFiltered(btn,cat){document.querySelectorAll('.filters button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');document.getElementById('list').innerHTML=changes.filter(x=>cat==='all'||x.cat===cat).map(card).join('')}
function openChange(c){modalText.innerHTML=`<span class="tag ${c.tag}">${c.cat}</span><div class="date">${c.date}</div><h2>${c.title}</h2><p>${c.text}</p><div class="warn"><b>Что делать бухгалтеру</b><br>${c.action}</div><b>Первоисточник</b><br><a class="source" href="${c.url}" target="_blank">${c.source} ↗</a>`;modal.classList.add('show')}
function closeModal(){modal.classList.remove('show')}
function doSearch(){let q=document.getElementById('search').value.toLowerCase().trim();if(!q)return;document.getElementById('title').textContent='Результаты поиска';let found=changes.filter(c=>(c.title+' '+c.text+' '+c.cat).toLowerCase().includes(q));content.innerHTML=found.length?`<div class="muted" style="margin-bottom:15px">Найдено: ${found.length}</div><div class="grid">${found.map(card).join('')}</div>`:`<div class="section"><h2>Ничего не найдено</h2><p>Попробуйте «НДС», «НДФЛ», «УСН», «взносы» или «РСВ».</p></div>`}
content.innerHTML=home();
</script></body></html>
