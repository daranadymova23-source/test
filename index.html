<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>БУХ.Контроль — справочная система бухгалтера</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f5f7;color:#202a33;font:14px Arial,Helvetica,sans-serif}.app{display:flex;min-height:100vh}.side{width:248px;background:#202b35;color:#fff;position:fixed;inset:0 auto 0 0;padding:24px 16px}.logo{font-size:22px;font-weight:700;margin:4px 12px 30px}.logo span{font-weight:400;color:#b8c2ca}.nav button{width:100%;border:0;background:none;color:#b8c2ca;text-align:left;padding:11px 13px;border-radius:6px;margin:2px 0;cursor:pointer}.nav button.active,.nav button:hover{background:#34424d;color:#fff}.main{margin-left:248px;width:calc(100% - 248px);padding:28px 42px 50px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.top h1{font-size:26px;font-weight:600;margin:0}.date{color:#697782}.search{display:flex;max-width:900px;margin-bottom:24px}.search input{flex:1;padding:14px 16px;border:1px solid #cbd3d9;border-radius:6px 0 0 6px;background:#fff;font-size:15px}.search button{padding:0 22px;border:0;background:#2e6f59;color:#fff;border-radius:0 6px 6px 0}.section{background:#fff;border:1px solid #dfe4e8;border-radius:6px;padding:22px;margin-bottom:20px}.section h2{font-size:18px;margin:0 0 18px}.section h3{font-size:15px;margin:0 0 10px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:#fff;border:1px solid #dfe4e8;border-radius:6px;padding:18px}.card .label{color:#697782;font-size:12px}.card .value{font-size:24px;font-weight:600;margin:7px 0}.card .note{color:#56636c;line-height:1.5}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px;border-bottom:1px solid #e7ebee;text-align:left;vertical-align:top}.table th{font-size:12px;color:#697782;font-weight:600}.tag{display:inline-block;font-size:11px;padding:4px 7px;border-radius:4px;background:#e8f1ed;color:#2e6f59;margin-bottom:7px}.tag.warn{background:#f4ecdc;color:#8a651e}.link{color:#2e6f59;text-decoration:none}.notice{background:#fff;border:1px solid #dfe4e8;border-left:4px solid #2e6f59;border-radius:6px;padding:18px 20px;margin-bottom:20px;line-height:1.5}.muted{color:#697782;line-height:1.55}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.filter{background:#eef1f3;border:1px solid #d8dee2;border-radius:5px;padding:8px 12px;cursor:pointer}.filter.active{background:#34424d;color:#fff}.items .item{padding:17px 0;border-top:1px solid #e9edef;display:grid;grid-template-columns:100px 1fr auto;gap:18px}.items .item:first-child{border-top:0}.datecol{color:#6d7a83;font-size:12px}.item h3{margin:0 0 7px;font-size:15px}.item p{margin:0;color:#56636c;line-height:1.5}.calendar{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.cal{border:1px solid #dfe4e8;border-radius:6px;padding:15px}.cal .day{font-size:22px;font-weight:600}.cal .month{color:#68757e;margin-bottom:8px}.modal{display:none;position:fixed;inset:0;background:#0007;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.box{background:#fff;border-radius:7px;width:min(820px,100%);max-height:90vh;overflow:auto;padding:26px}.close{float:right;border:1px solid #d7dde1;background:#fff;border-radius:5px;width:32px;height:32px;cursor:pointer}@media(max-width:900px){.side{width:70px;padding:20px 8px}.logo{font-size:0;text-align:center}.logo:after{content:'БУ';font-size:20px}.nav button{font-size:0;text-align:center}.main{margin-left:70px;width:calc(100% - 70px);padding:22px}.grid{grid-template-columns:1fr 1fr}.calendar{grid-template-columns:1fr 1fr}}@media(max-width:560px){.grid,.calendar{grid-template-columns:1fr}.main{padding:15px}.items .item{grid-template-columns:1fr}}
</style></head><body><div class="app"><aside class="side"><div class="logo">БУХ.<span>Контроль</span></div><nav class="nav"><button class="active" onclick="show('home',this)">Главная</button><button onclick="show('changes',this)">Изменения</button><button onclick="show('tax',this)">Налоги</button><button onclick="show('accounting',this)">Бухгалтерский учет</button><button onclick="show('labor',this)">Зарплата и кадры</button><button onclick="show('calendar',this)">Календарь бухгалтера</button><button onclick="show('references',this)">Справочники</button></nav></aside><main class="main"><div class="top"><h1 id="title">Главная</h1><div class="date">25 августа 2026 г.</div></div><div id="content"></div></main></div><div class="modal" id="modal"><div class="box"><button class="close" onclick="modal.classList.remove('show')">×</button><div id="modalContent"></div></div></div><script>
const changes=[{date:'25.08.2026',cat:'Налоги',title:'НДС: изменения с 2026 года',text:'С 2026 года основная ставка НДС составляет 22%.',action:'Проверить ставки НДС и настройки учетной системы.'},{date:'22.08.2026',cat:'Бухучет',title:'ФСБУ: учет и раскрытие информации',text:'Проверьте учетную политику и раскрытие существенной информации в отчетности.',action:'Сверить рабочие документы с действующей учетной политикой.'},{date:'20.08.2026',cat:'Зарплата',title:'НДФЛ и страховые взносы: правила 2026 года',text:'Для зарплаты действует прогрессивная шкала НДФЛ; единая предельная база взносов на 2026 год — 2 979 000 руб.',action:'Проверить настройки зарплаты, НДФЛ и страховых взносов.'},{date:'18.08.2026',cat:'Налоги',title:'УСН: контроль лимитов и НДС',text:'Проверьте право на освобождение и обязанности по НДС при применении УСН.',action:'Проверить показатели организации и учетную политику.'}];
const labor={
summary:[['МРОТ с 01.01.2026','27 093 ₽','Федеральный МРОТ'],['Предельная база взносов','2 979 000 ₽','На 2026 год'],['Единый тариф взносов','30%','В пределах базы'],['Сверх предельной базы','15,1%','Общий тариф']],
ndfl:[['До 2,4 млн ₽','13%','Основные доходы, включая зарплату'],['Свыше 2,4 до 5 млн ₽','15%','Часть налоговой базы'],['Свыше 5 до 20 млн ₽','18%','Часть налоговой базы'],['Свыше 20 до 50 млн ₽','20%','Часть налоговой базы'],['Свыше 50 млн ₽','22%','Часть налоговой базы']],
links:[['НДФЛ','Ставки, налоговая база, вычеты, сроки перечисления'],['Страховые взносы','Тарифы, предельная база, пониженные тарифы'],['МРОТ','Федеральный и региональный МРОТ'],['Отпуска','График отпусков, расчет отпускных, перенос'],['Больничные','Пособия, стаж, расчет среднего заработка'],['Кадровый учет','Прием, перевод, увольнение, трудовые договоры'],['ЕФС-1','Сроки и порядок представления сведений в СФР'],['Воинский учет','Обязанности работодателя и кадровые документы']]};
const content=document.getElementById('content'),modal=document.getElementById('modal'),modalContent=document.getElementById('modalContent');
function item(c){return `<div class="item"><div class="datecol">${c.date}</div><div><span class="tag ${c.cat==='Налоги'?'warn':''}">${c.cat}</span><h3>${c.title}</h3><p>${c.text}</p></div><a class="link" href="#" onclick="openChange('${c.title.replace(/'/g,"\\'")}');return false">Подробнее</a></div>`}
function home(){content.innerHTML=`<div class="search"><input id="q" placeholder="Поиск по законодательству, ФСБУ, НК РФ, НДФЛ, НДС..." onkeydown="if(event.key==='Enter')search()"><button onclick="search()">Найти</button></div><div class="notice"><strong>Контроль изменений</strong>Актуальные нормы и изменения законодательства. Для практического применения проверяйте первоисточник.</div><div class="section"><h2>Последние изменения</h2><div class="items">${changes.map(item).join('')}</div></div>`}
function changesPage(){content.innerHTML=`<div class="search"><input id="q" placeholder="Поиск изменений..." onkeydown="if(event.key==='Enter')search()"><button onclick="search()">Найти</button></div><div class="section"><div class="filters"><button class="filter active" onclick="filter('Все',this)">Все</button><button class="filter" onclick="filter('Налоги',this)">Налоги</button><button class="filter" onclick="filter('Бухучет',this)">Бухучет</button><button class="filter" onclick="filter('Зарплата',this)">Зарплата</button></div><div id="changeList" class="items">${changes.map(item).join('')}</div></div>`}
function filter(cat,btn){document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));btn.classList.add('active');document.getElementById('changeList').innerHTML=changes.filter(x=>cat==='Все'||x.cat===cat).map(item).join('')}
function search(){const q=(document.getElementById('q')?.value||'').toLowerCase().trim();const found=changes.filter(x=>(x.title+x.text+x.cat).toLowerCase().includes(q));content.innerHTML=`<div class="section"><h2>Результаты поиска${q?' по запросу «'+q+'»':''}</h2><div class="items">${found.map(item).join('')||'<p class="muted">По запросу ничего не найдено.</p>'}</div></div>`}
function openChange(title){const c=changes.find(x=>x.title===title);modalContent.innerHTML=`<span class="tag">${c.cat}</span><h2>${c.title}</h2><p><strong>Что изменилось</strong></p><p>${c.text}</p><p><strong>Что сделать бухгалтеру</strong></p><p>${c.action}</p><p class="muted">Первоисточник: официальные материалы ФНС России. Данные в прототипе требуют проверки перед применением.</p>`;modal.classList.add('show')}
function laborPage(){content.innerHTML=`<div class="notice"><strong>Зарплата и кадры — 2026</strong>Основные показатели и практические справочные материалы для расчета зарплаты, НДФЛ, страховых взносов и кадрового учета.</div><div class="grid">${labor.summary.map(x=>`<div class="card"><div class="label">${x[0]}</div><div class="value">${x[1]}</div><div class="note">${x[2]}</div></div>`).join('')}</div><div class="section"><h2>НДФЛ: прогрессивная шкала для основных доходов</h2><table class="table"><thead><tr><th>Диапазон налоговой базы</th><th>Ставка</th><th>Примечание</th></tr></thead><tbody>${labor.ndfl.map(x=>`<tr><td>${x[0]}</td><td><strong>${x[1]}</strong></td><td>${x[2]}</td></tr>`).join('')}</tbody></table><p class="muted">Для зарплаты и иных основных доходов налоговая ставка применяется по соответствующей части налоговой базы.</p></div><div class="section"><h2>Страховые взносы</h2><table class="table"><tbody><tr><th>Показатель</th><th>Значение</th></tr><tr><td>Единая предельная величина базы на 2026 год</td><td><strong>2 979 000 ₽</strong></td></tr><tr><td>Общий тариф в пределах базы</td><td><strong>30%</strong></td></tr><tr><td>Тариф сверх предельной базы</td><td><strong>15,1%</strong></td></tr><tr><td>МРОТ для минимальной базы руководителя коммерческой организации</td><td><strong>27 093 ₽</strong></td></tr><tr><td>Минимальные взносы с МРОТ при тарифе 30%</td><td><strong>8 127,90 ₽ в месяц</strong></td></tr></tbody></table></div><div class="section"><h2>Разделы</h2><div class="grid">${labor.links.map(x=>`<div class="card"><h3>${x[0]}</h3><div class="note">${x[1]}</div><br><a class="link" href="#" onclick="openTopic('${x[0]}');return false">Открыть справку</a></div>`).join('')}</div></div>`}
function openTopic(t){modalContent.innerHTML=`<h2>${t}</h2><p class="muted">В этом разделе будут собраны нормы, расчеты, сроки, формы документов и практические комментарии по теме «${t}».</p><p><strong>Источник для проверки:</strong> ФНС России, СФР, Роструд и официальное опубликование нормативных актов.</p>`;modal.classList.add('show')}
function sectionPage(title,text,buttons){content.innerHTML=`<div class="section"><h2>${title}</h2><p class="muted">${text}</p><div class="grid">${buttons.map(x=>`<div class="card"><h3>${x}</h3><p class="note">Справочная информация, нормы, сроки и документы.</p><a class="link" href="#" onclick="openTopic('${x}');return false">Открыть раздел</a></div>`).join('')}</div></div>`}
function calendarPage(){content.innerHTML=`<div class="section"><h2>Календарь бухгалтера</h2><p class="muted">Контроль отчетности и платежей. Даты в прототипе требуют проверки по официальному календарю.</p><div class="calendar"><div class="cal"><div class="day">28</div><div class="month">августа</div><p>Контроль налоговых платежей</p></div><div class="cal"><div class="day">31</div><div class="month">августа</div><p>Кадровые документы</p></div><div class="cal"><div class="day">1</div><div class="month">сентября</div><p>Новый отчетный период</p></div><div class="cal"><div class="day">25</div><div class="month">сентября</div><p>Налоговые обязательства</p></div></div></div>`}
function show(name,btn){document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');const titles={home:'Главная',changes:'Изменения',tax:'Налоги',accounting:'Бухгалтерский учет',labor:'Зарплата и кадры',calendar:'Календарь бухгалтера',references:'Справочники'};document.getElementById('title').textContent=titles[name];if(name==='home')home();else if(name==='changes')changesPage();else if(name==='labor')laborPage();else if(name==='calendar')calendarPage();else if(name==='tax')sectionPage('Налоги','Налоговый блок для ежедневной работы бухгалтера.',['НДС','НДФЛ','УСН','Налог на прибыль','Страховые взносы','Налог на имущество']);else if(name==='accounting')sectionPage('Бухгалтерский учет','ФСБУ, ПБУ, план счетов, первичные документы и отчетность.',['ФСБУ','План счетов','Учетная политика','Первичные документы','Бухгалтерская отчетность']);else sectionPage('Справочники','Часто используемые показатели и нормативные сведения.',['МРОТ','Ставки налогов','Лимиты','Сроки отчетности','Формы отчетности']);}home();</script></body></html>
