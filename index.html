<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>БУХ.Контроль — справочная система бухгалтера</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f5f7;color:#202a33;font:14px Arial,Helvetica,sans-serif}.app{display:flex;min-height:100vh}.side{width:248px;background:#202b35;color:#fff;position:fixed;inset:0 auto 0 0;padding:24px 16px}.logo{font-size:22px;font-weight:700;letter-spacing:-.3px;margin:4px 12px 30px}.logo span{font-weight:400;color:#b8c2ca}.nav button{width:100%;border:0;background:none;color:#b8c2ca;text-align:left;padding:11px 13px;border-radius:6px;margin:2px 0;cursor:pointer}.nav button.active{background:#34424d;color:#fff}.nav button:hover{background:#2d3b46;color:#fff}.main{margin-left:248px;width:calc(100% - 248px);padding:28px 42px 50px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.top h1{font-size:26px;font-weight:600;margin:0}.date{color:#697782}.search{display:flex;max-width:900px;margin-bottom:24px}.search input{flex:1;padding:14px 16px;border:1px solid #cbd3d9;border-radius:6px 0 0 6px;background:#fff;font-size:15px}.search button{padding:0 22px;border:0;background:#2e6f59;color:#fff;border-radius:0 6px 6px 0}.notice{background:#fff;border:1px solid #dfe4e8;border-left:4px solid #2e6f59;border-radius:6px;padding:18px 20px;margin-bottom:22px}.notice strong{display:block;margin-bottom:6px}.section{background:#fff;border:1px solid #dfe4e8;border-radius:6px;padding:22px;margin-bottom:20px}.section h2{font-size:18px;font-weight:600;margin:0 0 18px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.filter{background:#eef1f3;border:1px solid #d8dee2;border-radius:5px;padding:8px 12px;cursor:pointer}.filter.active{background:#34424d;color:#fff;border-color:#34424d}.items{display:grid;gap:0}.item{padding:17px 0;border-top:1px solid #e9edef;display:grid;grid-template-columns:105px 1fr auto;gap:18px;align-items:start}.item:first-child{border-top:0}.datecol{color:#6d7a83;font-size:12px}.item h3{margin:0 0 7px;font-size:15px;font-weight:600}.item p{margin:0;color:#56636c;line-height:1.5}.link{color:#2e6f59;text-decoration:none;white-space:nowrap}.tag{display:inline-block;font-size:11px;padding:4px 7px;border-radius:4px;background:#e8f1ed;color:#2e6f59;margin-bottom:7px}.tag.tax{background:#f4ecdc;color:#8a651e}.tag.labor{background:#e8edf3;color:#4b6376}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#fff;border:1px solid #dfe4e8;border-radius:6px;padding:17px}.card .label{color:#6d7a83;font-size:12px}.card .value{font-size:23px;font-weight:600;margin:7px 0}.card .sub{font-size:12px;color:#697782}.calendar{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.cal{border:1px solid #dfe4e8;border-radius:6px;padding:15px}.cal .day{font-size:22px;font-weight:600}.cal .month{color:#68757e;margin-bottom:8px}.cal p{margin:0;line-height:1.4}.empty{padding:25px;color:#73808a;text-align:center}.modal{display:none;position:fixed;inset:0;background:#0007;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.box{background:#fff;border-radius:7px;width:min(820px,100%);max-height:90vh;overflow:auto;padding:26px}.close{float:right;border:1px solid #d7dde1;background:#fff;border-radius:5px;width:32px;height:32px;cursor:pointer}.doc h2{font-size:22px;font-weight:600}.doc-meta{color:#6c7982;margin-bottom:18px}.doc p{line-height:1.65}.doc ul{line-height:1.7}.source{margin-top:20px;padding-top:15px;border-top:1px solid #e5e9ec}.source a{color:#2e6f59}@media(max-width:900px){.side{width:70px;padding:20px 8px}.logo{font-size:0;text-align:center}.logo:after{content:'БУ';font-size:20px}.nav button{font-size:0;text-align:center}.nav button:first-letter{font-size:18px}.main{margin-left:70px;width:calc(100% - 70px);padding:22px}.cards{grid-template-columns:repeat(2,1fr)}.calendar{grid-template-columns:1fr 1fr}}@media(max-width:560px){.cards,.calendar{grid-template-columns:1fr}.main{padding:15px}.item{grid-template-columns:1fr}.link{white-space:normal}.search button{padding:0 15px}}</style></head><body><div class="app"><aside class="side"><div class="logo">БУХ.<span>Контроль</span></div><nav class="nav"><button class="active" onclick="show('home',this)">Главная</button><button onclick="show('changes',this)">Изменения</button><button onclick="show('tax',this)">Налоги</button><button onclick="show('accounting',this)">Бухгалтерский учет</button><button onclick="show('labor',this)">Зарплата и кадры</button><button onclick="show('calendar',this)">Календарь бухгалтера</button><button onclick="show('references',this)">Справочники</button></nav></aside><main class="main"><div class="top"><h1 id="title">Главная</h1><div class="date">25 августа 2026 г.</div></div><div id="content"></div></main></div><div class="modal" id="modal"><div class="box"><button class="close" onclick="modal.classList.remove('show')">×</button><div id="modalContent"></div></div></div><script>
const changes=[{date:'25.08.2026',cat:'Налоги',title:'НДС: новые правила применения ставок и вычетов',text:'Изменения налогового законодательства. Проверьте настройки учетной системы и порядок оформления счетов-фактур.',action:'Проверить учетную политику и настройки НДС.'},{date:'22.08.2026',cat:'Бухучет',title:'ФСБУ: изменения в порядке раскрытия информации',text:'Уточнен порядок представления отдельных показателей бухгалтерской отчетности.',action:'Проверить учетную политику и рабочие документы.'},{date:'20.08.2026',cat:'Зарплата',title:'НДФЛ и страховые взносы: актуальные требования',text:'Обновлены правила расчета и представления сведений по доходам работников.',action:'Проверить настройки расчета зарплаты и отчетность.'},{date:'18.08.2026',cat:'Налоги',title:'УСН: контроль лимитов и обязанности налогоплательщиков',text:'Обратите внимание на актуальные лимиты и порядок определения налоговой базы.',action:'Проверить показатели организации.'}];
const content=document.getElementById('content'),modal=document.getElementById('modal'),modalContent=document.getElementById('modalContent');
function item(c){return `<div class="item"><div class="datecol">${c.date}</div><div><span class="tag ${c.cat==='Налоги'?'tax':c.cat==='Зарплата'?'labor':''}">${c.cat}</span><h3>${c.title}</h3><p>${c.text}</p></div><a class="link" href="#" onclick="openDoc('${c.title.replace(/'/g,'\\\'')}');return false">Подробнее</a></div>`}
function home(){content.innerHTML=`<div class="search"><input id="q" placeholder="Поиск по законодательству, ФСБУ, НК РФ, НДФЛ, НДС..." onkeydown="if(event.key==='Enter')search()"><button onclick="search()">Найти</button></div><div class="notice"><strong>Контроль изменений</strong>Следите за изменениями законодательства и проверяйте документы, которые требуют действий со стороны бухгалтера.</div><div class="cards"><div class="card"><div class="label">Изменения за месяц</div><div class="value">18</div><div class="sub">6 требуют внимания</div></div><div class="card"><div class="label">Ближайший срок</div><div class="value">28.08</div><div class="sub">Отчетность и платежи</div></div><div class="card"><div class="label">Налоговые темы</div><div class="value">24</div><div class="sub">В избранном</div></div><div class="card"><div class="label">Документы</div><div class="value">47</div><div class="sub">Сохранено</div></div></div><div class="section"><h2>Последние изменения</h2><div class="items">${changes.map(item).join('')}</div></div><div class="section"><h2>Ближайшие сроки</h2><div class="calendar"><div class="cal"><div class="day">28</div><div class="month">августа</div><p>Платежи и отчетность</p></div><div class="cal"><div class="day">31</div><div class="month">августа</div><p>Кадровые документы</p></div><div class="cal"><div class="day">1</div><div class="month">сентября</div><p>Новый отчетный период</p></div><div class="cal"><div class="day">25</div><div class="month">сентября</div><p>Налоговый календарь</p></div></div></div>`}
function changesPage(){content.innerHTML=`<div class="search"><input id="q" placeholder="Поиск изменений..."><button onclick="search()">Найти</button></div><div class="section"><div class="filters"><button class="filter active" onclick="filter('Все',this)">Все</button><button class="filter" onclick="filter('Налоги',this)">Налоги</button><button class="filter" onclick="filter('Бухучет',this)">Бухучет</button><button class="filter" onclick="filter('Зарплата',this)">Зарплата</button></div><div id="changeList" class="items">${changes.map(item).join('')}</div></div>`}
function filter(cat,btn){document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));btn.classList.add('active');document.getElementById('changeList').innerHTML=changes.filter(x=>cat==='Все'||x.cat===cat).map(item).join('')||'<div class="empty">Изменений не найдено</div>'}
function search(){const q=(document.getElementById('q')?.value||'').toLowerCase().trim();const found=changes.filter(x=>(x.title+x.text+x.cat).toLowerCase().includes(q));content.innerHTML=`<div class="section"><h2>Результаты поиска${q?' по запросу «'+q+'»':''}</h2><div class="items">${found.map(item).join('')||'<div class="empty">По вашему запросу ничего не найдено</div>'}</div></div>`}
function openDoc(title){const c=changes.find(x=>x.title===title);modalContent.innerHTML=`<div class="doc"><span class="tag">${c.cat}</span><h2>${c.title}</h2><div class="doc-meta">Дата публикации: ${c.date}</div><p><strong>Что изменилось</strong></p><p>${c.text}</p><p><strong>Что сделать бухгалтеру</strong></p><ul><li>${c.action}</li><li>Проверить внутренние документы и учетные настройки.</li><li>При необходимости обновить рабочие инструкции.</li></ul><div class="source">Первоисточник: <a href="https://www.nalog.gov.ru/" target="_blank">ФНС России</a> и официальные нормативные документы</div></div>`;modal.classList.add('show')}
function simple(title,text){content.innerHTML=`<div class="section"><h2>${title}</h2><p>${text}</p><div class="filters"><button class="filter" onclick="openDoc('НДС: новые правила применения ставок и вычетов')">НДС</button><button class="filter" onclick="openDoc('УСН: контроль лимитов и обязанности налогоплательщиков')">УСН</button><button class="filter" onclick="openDoc('ФСБУ: изменения в порядке раскрытия информации')">ФСБУ</button><button class="filter" onclick="openDoc('НДФЛ и страховые взносы: актуальные требования')">НДФЛ и взносы</button></div></div>`}
function show(name,btn){document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');const titles={home:'Главная',changes:'Изменения',tax:'Налоги',accounting:'Бухгалтерский учет',labor:'Зарплата и кадры',calendar:'Календарь бухгалтера',references:'Справочники'};document.getElementById('title').textContent=titles[name];if(name==='home')home();else if(name==='changes')changesPage();else if(name==='tax')simple('Налоги','НДС, НДФЛ, УСН, налог на прибыль, страховые взносы и другие налоговые вопросы.');else if(name==='accounting')simple('Бухгалтерский учет','ФСБУ, ПБУ, план счетов, первичные документы, учетная политика и бухгалтерская отчетность.');else if(name==='labor')simple('Зарплата и кадры','НДФЛ, страховые взносы, МРОТ, отпускные, больничные и кадровый учет.');else if(name==='calendar')content.innerHTML='<div class="section"><h2>Календарь бухгалтера</h2><div class="calendar"><div class="cal"><div class="day">28</div><div class="month">августа</div><p>Контроль платежей и отчетности</p></div><div class="cal"><div class="day">31</div><div class="month">августа</div><p>Кадровые документы</p></div><div class="cal"><div class="day">1</div><div class="month">сентября</div><p>Начало нового отчетного периода</p></div><div class="cal"><div class="day">25</div><div class="month">сентября</div><p>Налоговые обязательства</p></div></div></div>';else simple('Справочники','Ставки, лимиты, сроки, формы отчетности, реквизиты и другие часто используемые сведения.')}home();</script></body></html>
