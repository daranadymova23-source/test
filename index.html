<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ÉLAN — одежда</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f7f4ef;color:#24221f}header{padding:22px 6%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ddd6cd;position:sticky;top:0;background:#f7f4ef;z-index:2}.logo{font-size:28px;font-weight:bold;letter-spacing:5px}.cart{background:#24221f;color:white;border:0;border-radius:30px;padding:12px 20px}.hero{padding:70px 6%;display:grid;grid-template-columns:1.2fr .8fr;gap:40px;align-items:center}.hero h1{font-size:clamp(48px,7vw,90px);line-height:.9;margin:20px 0}.hero p{font-size:18px;line-height:1.6;color:#666}.hero-card{height:400px;border-radius:28px;background:linear-gradient(145deg,#d9c8b7,#8d7868);display:flex;align-items:end;padding:28px;color:white;font-size:24px}.controls{padding:0 6% 28px;display:flex;gap:10px;flex-wrap:wrap}.controls button{padding:12px 20px;border:0;border-radius:30px;background:#e7e1d9}.controls .active{background:#24221f;color:white}.grid{padding:0 6% 70px;display:grid;grid-template-columns:repeat(4,1fr);gap:22px}.product{background:white;border-radius:20px;overflow:hidden}.photo{height:300px;padding:18px;display:flex;align-items:end;color:white;font-weight:bold}.a{background:linear-gradient(145deg,#d8c8ba,#8c7869)}.b{background:linear-gradient(145deg,#bfc4bd,#656c63)}.c{background:linear-gradient(145deg,#d9b7b0,#956e68)}.d{background:linear-gradient(145deg,#d5c7a8,#857650)}.info{padding:18px}.info h3{margin:0 0 8px}.price{font-weight:bold}.buy{width:100%;margin-top:15px;padding:12px;border:0;border-radius:12px;background:#24221f;color:white}@media(max-width:900px){.hero{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.grid{grid-template-columns:1fr}.hero-card{height:280px}}</style></head><body><header><div class="logo">ÉLAN</div><button class="cart" onclick="alert('Товаров в корзине: '+cart)">Корзина · <span id="count">0</span></button></header><section class="hero"><div><small>НОВАЯ КОЛЛЕКЦИЯ · 2026</small><h1>Одежда,<br>в которой<br>есть характер.</h1><p>Тестовый интернет-магазин современной базовой одежды. Минимализм, спокойные оттенки и вещи на каждый день.</p></div><div class="hero-card">ÉLAN / everyday collection</div></section><div class="controls"><button class="active" onclick="show('all',this)">Все</button><button onclick="show('Верх',this)">Верх</button><button onclick="show('Низ',this)">Низ</button><button onclick="show('Платья',this)">Платья</button></div><section class="grid" id="grid"></section><script>const p=[['Молочная рубашка','Верх',5490,'a'],['Оливковый жакет','Верх',7990,'b'],['Платье Rose','Платья',6990,'c'],['Брюки Sand','Низ',5990,'d']];let cart=0;function render(x=p){grid.innerHTML=x.map((v,i)=>`<article class="product"><div class="photo ${v[3]}">${v[1]}</div><div class="info"><h3>${v[0]}</h3><div class="price">${v[2].toLocaleString('ru-RU')} ₽</div><button class="buy" onclick="cart++;count.textContent=cart">Добавить в корзину</button></div></article>`).join('')}function show(c,b){document.querySelectorAll('.controls button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(c==='all'?p:p.filter(x=>x[1]===c))}render();</script></body></html>
