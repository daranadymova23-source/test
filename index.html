<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ÉLAN — интернет-магазин одежды</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f7f4ef;color:#24221f}button,input{font:inherit}button{cursor:pointer;border:0}header{padding:22px 6%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ddd6cd;position:sticky;top:0;background:#f7f4efee;backdrop-filter:blur(12px);z-index:10}.logo{font-size:28px;font-weight:700;letter-spacing:5px}.cart{background:#24221f;color:#fff;border-radius:30px;padding:12px 20px}.hero{padding:70px 6%;display:grid;grid-template-columns:1.1fr .9fr;gap:45px;align-items:center}.hero h1{font-size:clamp(48px,7vw,90px);line-height:.9;margin:20px 0}.hero p{font-size:18px;line-height:1.6;color:#666;max-width:650px}.hero-card{height:430px;border-radius:28px;background:linear-gradient(145deg,#d9c8b7,#8d7868);display:flex;align-items:end;padding:28px;color:white;font-size:24px}.controls{padding:0 6% 28px;display:flex;gap:10px;flex-wrap:wrap}.controls button{padding:12px 20px;border-radius:30px;background:#e7e1d9}.controls .active{background:#24221f;color:white}.grid{padding:0 6% 80px;display:grid;grid-template-columns:repeat(4,1fr);gap:22px}.product{background:white;border-radius:20px;overflow:hidden;transition:.2s}.product:hover{transform:translateY(-4px)}.photo{height:330px;padding:18px;display:flex;align-items:end;color:white;font-weight:bold;background-size:cover;background-position:center}.a{background:linear-gradient(145deg,#d8c8ba,#8c7869)}.b{background:linear-gradient(145deg,#bfc4bd,#656c63)}.c{background:linear-gradient(145deg,#d9b7b0,#956e68)}.d{background:linear-gradient(145deg,#d5c7a8,#857650)}.info{padding:18px}.info h3{margin:0 0 8px}.muted{color:#777;font-size:14px}.price{font-weight:bold;font-size:18px;margin-top:10px}.buy{width:100%;margin-top:15px;padding:12px;border-radius:12px;background:#24221f;color:white}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:20;padding:20px}.modal.show{display:flex}.box{background:#fff;border-radius:24px;width:min(900px,100%);max-height:90vh;overflow:auto;padding:28px;position:relative}.close{position:absolute;right:20px;top:18px;background:#eee;border-radius:50%;width:38px;height:38px}.product-page{display:grid;grid-template-columns:1fr 1fr;gap:28px}.big-photo{min-height:430px;border-radius:20px;display:flex;align-items:end;padding:24px;color:#fff;font-size:20px}.sizes{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.size{padding:10px 18px;border:1px solid #ccc;border-radius:10px;background:#fff}.size.selected{background:#24221f;color:#fff}.qty{display:flex;align-items:center;gap:15px;margin:20px 0}.qty button{width:35px;height:35px;border-radius:50%;background:#eee}.checkout input{width:100%;padding:13px;border:1px solid #ddd;border-radius:10px;margin:7px 0}.checkout button{width:100%;padding:14px;background:#24221f;color:#fff;border-radius:12px;margin-top:10px}.cart-item{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:15px 0}.total{font-size:20px;font-weight:bold;margin:20px 0}@media(max-width:900px){.hero,.product-page{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.grid{grid-template-columns:1fr}.hero-card,.big-photo{min-height:280px;height:280px}}
</style></head>
<body>
<header><div class="logo">ÉLAN</div><button class="cart" onclick="openCart()">Корзина · <span id="count">0</span></button></header>
<section class="hero"><div><small>НОВАЯ КОЛЛЕКЦИЯ · 2026</small><h1>Одежда,<br>в которой<br>есть характер.</h1><p>Современная базовая одежда на каждый день. Спокойные оттенки, чистые формы и вещи, которые легко сочетать.</p></div><div class="hero-card">ÉLAN / everyday collection</div></section>
<div class="controls"><button class="active" onclick="filterProducts('all',this)">Все</button><button onclick="filterProducts('Верх',this)">Верх</button><button onclick="filterProducts('Низ',this)">Низ</button><button onclick="filterProducts('Платья',this)">Платья</button></div>
<section class="grid" id="grid"></section>
<div class="modal" id="productModal"><div class="box"><button class="close" onclick="closeModal('productModal')">×</button><div id="productContent"></div></div></div>
<div class="modal" id="cartModal"><div class="box"><button class="close" onclick="closeModal('cartModal')">×</button><h2>Корзина</h2><div id="cartContent"></div></div></div>
<script>
const products=[
{id:1,name:'Молочная рубашка',cat:'Верх',price:5490,cls:'a',desc:'Свободная рубашка из мягкой ткани. Универсальная модель для повседневных образов.'},
{id:2,name:'Оливковый жакет',cat:'Верх',price:7990,cls:'b',desc:'Структурированный жакет спокойного оливкового оттенка.'},
{id:3,name:'Платье Rose',cat:'Платья',price:6990,cls:'c',desc:'Лаконичное платье свободного силуэта в пудровом оттенке.'},
{id:4,name:'Брюки Sand',cat:'Низ',price:5990,cls:'d',desc:'Прямые брюки в оттенке sand с комфортной посадкой.'}
];
let cart=[];
function money(n){return n.toLocaleString('ru-RU')+' ₽'}
function render(list=products){grid.innerHTML=list.map(p=>`<article class="product"><div class="photo ${p.cls}">${p.cat}</div><div class="info"><h3>${p.name}</h3><div class="muted">${p.desc}</div><div class="price">${money(p.price)}</div><button class="buy" onclick="openProduct(${p.id})">Выбрать размер</button></div></article>`).join('')}
function filterProducts(cat,btn){document.querySelectorAll('.controls button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');render(cat==='all'?products:products.filter(p=>p.cat===cat))}
function openProduct(id){const p=products.find(x=>x.id===id);productContent.innerHTML=`<div class="product-page"><div class="big-photo ${p.cls}">${p.cat}</div><div><small>${p.cat}</small><h2>${p.name}</h2><p>${p.desc}</p><div class="price">${money(p.price)}</div><h4>Размер</h4><div class="sizes">${['XS','S','M','L','XL'].map(s=>`<button class="size" onclick="selectSize(this)">${s}</button>`).join('')}</div><div class="qty"><span>Количество:</span><button onclick="changeQty(-1)">−</button><b id="qty">1</b><button onclick="changeQty(1)">+</button></div><button class="buy" onclick="addToCart(${p.id})">Добавить в корзину</button></div></div>`;document.getElementById('productModal').classList.add('show')}
let selectedSize='';function selectSize(btn){document.querySelectorAll('.size').forEach(x=>x.classList.remove('selected'));btn.classList.add('selected');selectedSize=btn.textContent}
let selectedQty=1;function changeQty(n){selectedQty=Math.max(1,selectedQty+n);document.getElementById('qty').textContent=selectedQty}
function addToCart(id){if(!selectedSize){alert('Выберите размер');return}const p=products.find(x=>x.id===id);cart.push({id,size:selectedSize,qty:selectedQty});updateCount();closeModal('productModal');openCart()}
function updateCount(){document.getElementById('count').textContent=cart.reduce((a,x)=>a+x.qty,0)}
function openCart(){let total=cart.reduce((sum,x)=>sum+products.find(p=>p.id===x.id).price*x.qty,0);cartContent.innerHTML=cart.length?cart.map((x,i)=>{const p=products.find(p=>p.id===x.id);return `<div class="cart-item"><span>${p.name} · ${x.size} × ${x.qty}</span><b>${money(p.price*x.qty)}</b></div>`}).join('')+`<div class="total">Итого: ${money(total)}</div><div class="checkout"><h3>Оформление заказа</h3><input placeholder="Ваше имя"><input type="tel" placeholder="Телефон"><input placeholder="Адрес доставки"><button onclick="placeOrder()">Оформить заказ</button></div>`:'<p>Корзина пока пуста.</p>';document.getElementById('cartModal').classList.add('show')}
function placeOrder(){alert('Спасибо! Это тестовый заказ — оплата пока не подключена.');cart=[];updateCount();closeModal('cartModal')}
function closeModal(id){document.getElementById(id).classList.remove('show');selectedSize='';selectedQty=1}
render();
</script></body></html>
