name: Switch to fixed wardrobe editor
on:
  push:
    branches: [main]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Switch editor script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<script src="wardrobe-editor.js"></script>'
          new='<script src="wardrobe-editor-v2.js"></script>'
          if old in s:
              p.write_text(s.replace(old,new),encoding='utf-8')
          PY
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Use fixed wardrobe editor'
          git push