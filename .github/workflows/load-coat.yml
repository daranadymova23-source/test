name: Load gray coat
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  inject:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Inject coat script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="coat-item.js"></script>'
          if tag not in s:
              marker='<script src="wardrobe-editor-v2.js"></script>'
              if marker in s:
                  s=s.replace(marker, marker+tag)
              else:
                  s=s.replace('</body>', tag+'</body>')
              p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Load gray coat'
          git pull --rebase origin main
          git push