name: Load wardrobe item scripts
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  inject:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Inject wardrobe scripts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin main
            git reset --hard origin/main
            python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tags=['<script src="coat-item.js"></script>','<script src="wardrobe-items-aug27.js"></script>']
          marker='<script src="wardrobe-editor-v2.js"></script>'
          changed=False
          for tag in tags:
              if tag not in s:
                  if marker in s:
                      s=s.replace(marker, marker+tag)
                  else:
                      s=s.replace('</body>', tag+'</body>')
                  changed=True
          if changed:
              p.write_text(s,encoding='utf-8')
          PY
            git add index.html
            if git diff --cached --quiet; then
              echo 'Wardrobe scripts are already loaded.'
              exit 0
            fi
            git commit -m 'Load new wardrobe items'
            if git push origin HEAD:main; then
              echo 'Wardrobe scripts loaded successfully.'
              exit 0
            fi
            echo "Push race on attempt $attempt; retrying..."
            sleep 2
          done
          echo 'Could not update index.html after retries.'
          exit 1